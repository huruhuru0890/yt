<!doctype html>
<meta charset="utf-8">
<title>yt</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
<iframe id="f" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
// https://<あなたのホスト>/yt.html?v=<動画ID(11文字)>
const id = new URLSearchParams(location.search).get('v') || '';
if (/^[\w-]{11}$/.test(id)) {
  document.getElementById('f').src = 'https://www.youtube.com/embed/' + id +
    '?autoplay=1&controls=0&loop=1&playlist=' + id + '&playsinline=1&origin=' + encodeURIComponent(location.origin);
}
</script>
